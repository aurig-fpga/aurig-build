# ============================================================================
# aurig-build Minimal Vivado Smoke Test Project Configuration
# ============================================================================
#
# This is a minimal working configuration for smoke testing the aurig-build → Vivado
# build flow. It targets a generic Artix-7 device with a simple blinky design.
#

schema_version: "1"
project_name: vivado_min
project_root: ..
top: demo_top

# ----------------------------------------------------------------------------
# Tool Configuration
# ----------------------------------------------------------------------------
tool:
  synth:
    kind: vivado
    version: "2023.1"
    exe: vivado
    env_script:
      linux: /opt/Xilinx/Vivado/2023.1/settings64.sh
      windows: C:/Xilinx/Vivado/2023.1/settings64.bat

# ----------------------------------------------------------------------------
# Device Configuration
# ----------------------------------------------------------------------------
device:
  vendor: xilinx
  family: artix7
  part: xc7a100t-1csg324

# ----------------------------------------------------------------------------
# Board Constraints
# ----------------------------------------------------------------------------
board:
  xdc_files:
    - constraints/pins.xdc

# ----------------------------------------------------------------------------
# File Sets
# ----------------------------------------------------------------------------
file_sets:
  rtl:
    - lib: work
      vhdl_std: 2008
      src:
        - src/demo_top.vhd

# ----------------------------------------------------------------------------
# Global Include Directories
# ----------------------------------------------------------------------------
include_dirs_global: []
