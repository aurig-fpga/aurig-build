[pytest]
# Pytest configuration for aurig-build test suite

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude smoke tests by default (require explicit opt-in)
norecursedirs = .git .tox dist build *.egg tests/smoke

# Markers
markers =
    smoke: Smoke tests that require real FPGA tools (run with --smoke)
    slow: Slow-running tests that invoke real tools (run with --slow)

# Output
addopts = 
    -ra
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage (optional, commented out since not in requirements)
# addopts = --cov=aurig_build --cov-report=term-missing

# Minimum Python version
minversion = 6.0
